[project]
name = "nlr-ghe-screen"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "folium>=0.12",
    "geopandas>=1.0.1",
    "ipykernel>=6.31.0",
    "jsonschema>=4.25.1",
    "mapclassify>=2.8.1",
    "matplotlib>=3.9.4",
    "pytest",
    "pytest-mock>=3.15.1",
    "rasterio>=1.4.3",
    "requests>=2.32.5",
    "sphinx>=7.4.7",
    "sphinx-rtd-theme>=3.1.0",
]

[project.scripts]
nlr-ghe-screen = "nlr_ghe_screen:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
